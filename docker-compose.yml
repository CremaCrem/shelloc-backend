version: '3.8'

services:
  backend:
    build: .
    container_name: shelloc-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    # Depending on how the frontend or other services are deployed, we could add them here
